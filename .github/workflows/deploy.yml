# .github/workflows/deploy.yml
#
# Build the image and deploy it.
#
# MANUAL ONLY (`workflow_dispatch`). The deploy target is undecided: the Hetzner
# host this job SSHes to is no longer functional, so running it automatically on
# every push to main would fail every build. Restore the `push:` trigger below
# once a target is chosen and HETZNER_HOST / HETZNER_SSH_KEY are set.

name: Deploy

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}    # urwithajit9/evnx-server
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  # ─── Job 2: Build & Push Docker Image ────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write    # Required to push to ghcr.io

    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.server
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SQLX_OFFLINE=true

  # ─── Job 3: Deploy to Hetzner ────────────────────────────────────────────
  deploy:
    name: Deploy to Hetzner
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://api.evnx.dev

    steps:
      - name: Checkout (for docker-compose file)
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd ~/evnx-server

            echo "📦 Pulling latest image..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository }}:${{ needs.build.outputs.image_digest || 'latest' }}

            echo "🔄 Updating image tag in compose..."
            # Update the image tag in the prod compose file
            export EVNX_IMAGE=ghcr.io/${{ github.repository }}:latest

            echo "📊 Running database migrations..."
            docker compose -f docker-compose.prod.yml run --rm migrator

            echo "🚀 Rolling restart (zero downtime)..."
            docker compose -f docker-compose.prod.yml up -d --no-deps --wait server

            echo "🏥 Health check..."
            sleep 5
            curl -sf https://api.evnx.dev/health || (echo "Health check FAILED" && exit 1)

            echo "🧹 Removing old images..."
            docker image prune -f

            echo "✓ Deployment complete"

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment FAILED for commit ${{ github.sha }}"
          # Add Slack/Discord webhook here if needed