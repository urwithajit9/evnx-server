[package]
name = "evnx-server"
version = "0.1.0"
edition = "2021"
description = "evnx cloud sync backend — stores encrypted vault blobs, authenticates via SRP-6a"

# ─── Web Framework ─────────────────────────────────────────────────────────────
[dependencies]
axum       = { version = "0.7", features = ["macros"] }
tokio      = { version = "1",   features = ["full"] }
tower      = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["trace", "cors", "request-id", "compression-gzip", "limit"] }

# ─── Database (Postgres) ────────────────────────────────────────────────────────
# default-features = false drops the `any` driver, which otherwise resolves
# sqlx-mysql and sqlx-sqlite into Cargo.lock. Neither is ever compiled, but
# cargo-audit scans the lockfile rather than the active feature graph, so their
# transitive deps (rsa, h2, idna, rustls-webpki) showed up as vulnerabilities in
# a Postgres-only server. `macros` is a default feature and must be named here.
sqlx = { version = "0.8", default-features = false, features = [
    "postgres",
    "macros",
    "runtime-tokio-rustls",
    "migrate",
    "uuid",
    "chrono",
    "json",
] }
uuid    = { version = "1",   features = ["v4", "serde"] }
chrono  = { version = "0.4", features = ["serde"] }

# ─── Serialization ─────────────────────────────────────────────────────────────
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# ─── Configuration ─────────────────────────────────────────────────────────────
dotenvy = "0.15"   # Loads .env file on startup

# ─── Error handling ─────────────────────────────────────────────────────────────
thiserror = "1"
anyhow    = "1"

# ─── Logging / Tracing ─────────────────────────────────────────────────────────
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Auth & validation
validator   = { version = "0.21", features = ["derive"] }
blake3      = "1"       # for hashing tokens and IPs
hex         = "0.4"     # encode/decode hex strings (SRP values are hex)
base64ct    = { version = "1", features = ["alloc"] }

# Valkey client — the `redis` crate speaks the Valkey wire protocol unchanged
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# SRP server-side (evnx-server runs the server half)
srp  = "0.6"
sha2 = "0.10"
num-bigint = "0.4"
subtle = "2.4"


# JWT
jsonwebtoken = "9"

# TOTP
totp-rs = { version = "5", features = ["qr"] }

# Axum extras for header extraction
axum-extra = { version = "0.9", features = ["typed-header"] }
headers    = "0.4"

# Zero-knowledge crypto primitives, shared with the evnx CLI so both ends of the
# wire agree byte for byte. Published to crates.io on 2026-09-13, so this is a
# plain registry dependency and CI, the Docker build and any fresh clone resolve
# it without the sibling checkout a path dependency needed.
#
# To iterate on evnx-crypto locally, override it *outside* this manifest —
# `.cargo/config.toml` is gitignored for exactly that:
#
#     [patch.crates-io]
#     evnx-crypto = { path = "../evnx-crypto" }
#
# Adding `path` back here would undo the fix even alongside a `version`: cargo
# always prefers the path and never falls back to the registry when it is
# missing. Verified — it errors rather than resolving.
evnx-crypto = "0.1"
rand = "0.8.0"

# Provider-agnostic object storage: S3, GCS, Azure Blob, local filesystem and
# any S3-compatible endpoint behind one trait. Replaces the direct AWS SDK so no
# single cloud is privileged.
object_store = { version = "0.14", features = ["aws", "gcp", "azure"] }

# HTTP client for Resend
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }

# Streaming response body
tokio-util = { version = "0.7", features = ["io"] }
bytes      = "1"
regex = "1.12.3"
base32 = "0.5.1"

[dev-dependencies]
# Testing HTTP endpoints without running a real server
axum-test = "14"
